name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: Pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      # Tests marked `network` hit live government hosts. They are excluded here so CI
      # never fails because a ministry's server happened to be down, and so the project
      # never sends CI traffic at those hosts on every push.
      - name: Test
        run: uv run pytest -q -m "not network"

  site:
    name: Site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      # The page reads data/public/site/headline.json from the repository root at build
      # time, so a build failure here also catches the published data going missing or
      # changing shape — not just a broken template.
      - name: Build
        run: npm run build
        working-directory: web
